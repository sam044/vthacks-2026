name: Validate HokieCare
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.in
      - run: python -m pytest -q
      - run: python scripts/package_companion.py
      - run: npm ci && node --test companion.test.mjs && npm run build
        working-directory: frontend
      - run: docker build -t hokiecare:ci .
      - name: Container health and frontend
        run: |
          docker run -d --name hokiecare-ci -p 8000:8000 hokiecare:ci
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/api/health
          curl --fail http://127.0.0.1:8000/ | grep 'HokieCare'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/services)" = "503"
          curl --fail -X POST -H 'X-HokieCare-Action: 1' http://127.0.0.1:8000/api/booking/session
          docker exec hokiecare-ci sh -c 'grep "Uid:" /proc/1/status | grep 10001'
          curl --fail http://127.0.0.1:8000/hokiecare-companion.zip -o /tmp/companion.zip
